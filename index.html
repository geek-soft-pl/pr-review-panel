<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR Review Panel</title>
    <!-- Paint the initial background to match the saved theme (default dark),
         so the pre-React loader doesn't flash the wrong color. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('github_pr_panel_theme_mode');
          document.documentElement.style.backgroundColor =
            mode === 'light' ? '#f6f8fa' : '#0d1117';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Loading spinner shown before React hydrates -->
      <div id="initial-loader" style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      ">
        <div style="
          width: 40px;
          height: 40px;
          border: 3px solid #30363d;
          border-top-color: #58a6ff;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
